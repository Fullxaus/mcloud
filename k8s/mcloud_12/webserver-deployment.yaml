apiVersion: apps/v1
kind: Deployment
metadata:
  name: webserver
  namespace: mcloud-12
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      labels:
        app: webserver
    spec:
      containers:
      - name: webserver
        image: simple-webserver:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
