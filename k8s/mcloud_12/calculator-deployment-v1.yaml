apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-v1
  namespace: mcloud-12
spec:
  replicas: 3
  selector:
    matchLabels:
      app: calculator
      version: v1
  template:
    metadata:
      labels:
        app: calculator
        version: v1
    spec:
      containers:
      - name: calculator
        image: calculator-v1:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: "v1"
