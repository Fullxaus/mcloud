apiVersion: apps/v1
kind: Deployment
metadata:
  name: configurable-calculator
  namespace: mcloud-13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configurable-calculator
  template:
    metadata:
      labels:
        app: configurable-calculator
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            ["sh", "-c", "until nc -z postgres-service 5432; do sleep 2; done"]
      containers:
        - name: calculator
          image: configurable-calculator:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: calculator-secret
                  key: database-password
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: calculator-secret
                  key: database-user
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: calculator-secret
                  key: api-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: calculator-secret
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: calculator-config
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.properties
              subPath: application.properties
            - name: config-volume
              mountPath: /app/config/database.properties
              subPath: database.properties
            - name: secret-volume
              mountPath: /app/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /config
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /config
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config-volume
          configMap:
            name: calculator-settings
        - name: secret-volume
          secret:
            secretName: calculator-secret
