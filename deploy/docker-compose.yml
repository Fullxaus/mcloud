version: '3.8'

services:
  webapp:
    image: ghcr.io/fullxaus/mcloud:latest
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
